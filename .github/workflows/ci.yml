name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test-sqlite:
    name: Tests · SQLite · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run pytest

  test-postgres:
    name: Tests · PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobboard
          POSTGRES_PASSWORD: jobboard
          POSTGRES_DB: jobboard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jobboard"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://jobboard:jobboard@localhost:5432/jobboard
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run python -m app.seed
      - name: Test suite against PostgreSQL
        run: |
          uv run alembic downgrade base
          uv run pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://jobboard:jobboard@localhost:5432/jobboard

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [lint, test-sqlite, test-postgres]
    steps:
      - uses: actions/checkout@v5
      - name: Build and start
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Health, seeded data and web UI
        run: |
          set -euo pipefail
          # Capture first, then assert: `curl | grep -q` trips pipefail (SIGPIPE, exit 23).
          health=$(curl --fail -s http://localhost:8000/health)
          echo "$health" | jq -e '.status == "ok"'
          jobs=$(curl --fail -s 'http://localhost:8000/api/v1/jobs?q=python')
          echo "$jobs" | jq -e '.total >= 1'
          home=$(curl --fail -s http://localhost:8000/)
          grep -q 'Find your next role' <<<"$home"
      - name: Register, log in and post a job through the API
        run: |
          set -euo pipefail
          curl --fail -s -X POST http://localhost:8000/api/v1/users -H 'Content-Type: application/json' \
            -d '{"username":"ci","email":"ci@example.com","password":"pipeline1"}'
          token=$(curl --fail -s -X POST http://localhost:8000/api/v1/auth/token \
            -d 'username=ci&password=pipeline1' | jq -r .access_token)
          curl --fail -s -X POST http://localhost:8000/api/v1/jobs -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"title":"CI Engineer","company":"GitHub","location":"Remote","description":"Keeps the pipeline green."}' \
            | jq -e '.id > 0'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down --volumes
