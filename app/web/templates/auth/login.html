{% extends "base.html" %}
{% block title %}Log in · JobBoard{% endblock %}
{% block content %}
<form class="card form narrow" method="post" action="/login">
  <h1>Log in</h1>
  <input type="hidden" name="next" value="{{ next }}">
  <label for="username">Username</label>
  <input id="username" name="username" value="{{ username }}" autocomplete="username" required autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
  <div class="actions"><button type="submit" class="button">Log in</button></div>
  <p class="muted">New here? <a href="/register">Create an account</a></p>
</form>
{% endblock %}
