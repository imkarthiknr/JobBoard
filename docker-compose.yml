# Web app + PostgreSQL. `docker compose up --build`, then open http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobboard
      POSTGRES_PASSWORD: jobboard
      POSTGRES_DB: jobboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jobboard -d jobboard']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://jobboard:jobboard@db:5432/jobboard
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-please}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
